[platformio]
default_envs = master_nano, side_nano

[env]
platform = atmelavr
framework = arduino
build_flags = -I include/control
monitor_speed = 115200

[env:nano]
board = nanoatmega328
build_src_filter = +<nano.cpp> +<hardware.cpp> +<custom_sensor.cpp> +<control/>
lib_deps = pololu/QTRSensors@4.0.0

; Velg riktig Nano-bootloader før opplasting. Ingen automatisk opplasting.
[env:nano_new_bootloader]
extends = env:nano
board = nanoatmega328new

[env:uno]
board = uno
build_src_filter = +<uno.cpp>

; Ny arkitektur. PC kobles til master_nano med USB.
[env:master_nano]
board = nanoatmega328
build_src_filter = +<master.cpp> +<side_link.cpp> +<hardware.cpp> +<custom_sensor.cpp> +<control/>
lib_deps = pololu/QTRSensors@4.0.0

[env:side_nano]
board = nanoatmega328
build_src_filter = +<side_nano.cpp>

[env:master_nano_new_bootloader]
extends = env:master_nano
board = nanoatmega328new

[env:side_nano_new_bootloader]
extends = env:side_nano
board = nanoatmega328new
