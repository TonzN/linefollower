[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_flags = -I include/control
build_src_filter = +<master.cpp> +<control_runtime.cpp> +<hardware.cpp> +<platform_runtime.cpp> +<control/>

; Kun bygge-/testprofil. Eksempelpinnene er ikke et godkjent koblingsskjema.
[env:esp32_fixture]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DLINEFOLLOW_BUILD_FIXTURE

[env:esp32_mux_fixture]
extends = env:esp32
build_flags = ${env:esp32.build_flags} -DLINEFOLLOW_BUILD_FIXTURE -DLINEFOLLOW_MUX_FIXTURE
